<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberScope-AI SIEM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cyberscope.css') }}">
</head>
<body>          
    <!-- Modern Vertical Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <h2 style="color: var(--accent-cyan); margin-bottom: 2.5rem; font-size: 1.4rem;">CyberScope-AI</h2>
        
        <div class="nav-links" style="display: flex; flex-direction: column; height: 100%;">
            <a href="{{ url_for('dashboard') }}" class="{% if active_page == 'dashboard' %}active{% endif %}">
                Dashboard
            </a>
            <a href="{{ url_for('incidents_view') }}" class="{% if active_page == 'incidents' %}active{% endif %}">
                Incidents
            </a>
            <a href="{{ url_for('analyzer_view') }}" class="{% if active_page == 'analyzer' %}active{% endif %}">
                Log Analyzer
            </a>
            <a href="{{ url_for('analytics_view') }}" class="{% if active_page == 'analytics' %}active{% endif %}">
                Analytics
            </a>
            
            <!-- Spacer to push logout to the bottom -->
            <div style="flex-grow: 1;"></div>
            
            <a href="{{ url_for('logout') }}" style="color: var(--accent-red); text-align: center; border: 1px solid rgba(248, 113, 113, 0.3); border-radius: 6px; padding: 0.6rem;">
                Logout
            </a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" id="main-content">
        <!-- Top Action Bar (Toggle Button + Theme Selector) -->
        <div class="top-bar">
            <button id="sidebar-toggle" class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
                <span id="toggle-icon">←</span>
            </button>

            <select id="theme-dropdown" class="theme-selector" onchange="changeTheme()">
                <option value="theme-default">Default SOC</option>
                <option value="theme-light">Light Mode</option>
                <option value="theme-matrix">Matrix Green</option>
                <option value="theme-sunset">Sunset Indigo</option>
                <option value="theme-arctic">Arctic Blue</option>
            </select>
        </div>

        {% block content %}
        <!-- Child templates inject content here -->
        {% endblock %}
    </main>

    <!-- UI Handler Scripts -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const toggleIcon = document.getElementById('toggle-icon');

            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');

            const isCollapsed = sidebar.classList.contains('collapsed');
            toggleIcon.textContent = isCollapsed ? '→' : '←';
            
            // Save user preference
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Force Chart.js to recalculate canvas widths for full-screen visuals
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 300);
        }

        function changeTheme() {
            const theme = document.getElementById('theme-dropdown').value;
            document.body.classList.remove('theme-default', 'theme-light', 'theme-matrix', 'theme-sunset', 'theme-arctic');
            document.body.classList.add(theme);
            localStorage.setItem('selectedTheme', theme);
        }

        window.onload = () => {
            // Restore theme
            const savedTheme = localStorage.getItem('selectedTheme') || 'theme-default';
            document.getElementById('theme-dropdown').value = savedTheme;
            document.body.classList.add(savedTheme);

            // Restore sidebar state
            if (localStorage.getItem('sidebarCollapsed') === 'true') {
                toggleSidebar();
            }
        };
    </script>
</body>
</html>
